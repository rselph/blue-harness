# blue-harness CI — the "prove it" guarantee, enforced on every change.
#
# Runs `make verify` (all slices, audit -> harden -> verify) on every push and
# every pull request. A regression in any slice turns the badge red and fails
# the check, so "99/99 green" can't silently rot.
#
# The harness has no external dependencies beyond a C toolchain + Python 3, both
# already on ubuntu-latest. We add gdb (so Slice A's under-tracer detection
# branch actually runs instead of skipping) and relax Yama ptrace_scope to 0 so
# the anti-ptrace *control* assertion — a sibling probe attaching to the
# unhardened baseline — can run as designed. Neither weakens the test: the
# guards being proven are in the binary, not in the host policy.
name: verify

on:
  push:
    branches: ['**']
  pull_request:

# A newer push to the same ref supersedes an in-flight run; PR runs are keyed
# separately so they aren't cancelled by pushes to the source branch.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: make verify (ELF + PE, 7 slices)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Record the toolchain blue-harness is being proven against
        run: |
          set -eux
          cc --version | head -1
          make --version | head -1
          python3 --version

      - name: Install gdb (enables Slice A's under-tracer detection branch)
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdb

      - name: Allow a sibling to ptrace the baseline (Slice A control)
        # The anti-ptrace guard is proven by the HARDENED binary refusing attach;
        # the baseline must stay attachable for that to be a real contrast. GitHub
        # runners may ship Yama ptrace_scope=1 (descendants only), which would
        # block the probe. Set it to 0; tolerate kernels without Yama.
        run: sudo sysctl -w kernel.yama.ptrace_scope=0 || true

      - name: make verify
        run: make verify

  # --------------------------------------------------------------------------
  # NOTE TO THE REPO OWNER — optional ARM64 job (disabled; uncomment to enable)
  #
  # The job above only proves the harness on x86-64. Several tests reach into
  # machine code (e.g. Slice D's tamper step patches an instruction's
  # immediate), and the encoding differs per architecture: on AArch64 a 32-bit
  # constant is split across movz/movk, so an x86-only byte search silently
  # finds nothing. That exact bug lived on main, green in CI, until a run on an
  # Apple-Silicon Linux VM caught it (fixed in d92e429).
  #
  # Enable this if you want:
  #   - arm64 regressions caught in CI rather than on a contributor's machine
  #     (Apple Silicon dev boxes / Linux VMs, Graviton, Raspberry Pi, and most
  #     Android/iOS native code — Track B — is arm64);
  #   - the README's "every defense fires" claim to hold on both architectures.
  # Cost: one extra job per push/PR. `ubuntu-24.04-arm` runners are free for
  # public repositories; private repos may need a paid/larger-runner plan.
  # Remember to update the README/badge wording if you turn it on.
